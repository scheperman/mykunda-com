<!doctype html>
<meta charset="utf-8">
<title>image-slot encode test</title>
<style>
  body{font:14px system-ui;margin:24px}
  .cell{position:relative;width:145px;aspect-ratio:4/3;border:1px dashed #999;margin:8px 0}
  image-slot{position:absolute;inset:0;width:100%;height:100%;display:block}
  pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}
</style>
<h1>image-slot encode test</h1>
<p>Two slots of the same rendered width (~145px, the list.html photo cell).
   The second one carries <code>data-store-dim="1600"</code>.</p>
<div class="cell"><image-slot id="plain" placeholder="default"></image-slot></div>
<div class="cell"><image-slot id="pinned" data-store-dim="1600" placeholder="pinned"></image-slot></div>
<pre id="out">running…</pre>
<script src="../image-slot.js"></script>
<script>
(async function(){
  const out = document.getElementById('out');
  const log = [];

  // A synthetic 3000×2000 "photo" with enough detail that the encoders
  // cannot collapse it to a few bytes.
  const src = document.createElement('canvas');
  src.width = 3000; src.height = 2000;
  const c = src.getContext('2d');
  const g = c.createLinearGradient(0,0,3000,2000);
  g.addColorStop(0,'#0b3d2e'); g.addColorStop(.5,'#c96442'); g.addColorStop(1,'#dfe7ea');
  c.fillStyle = g; c.fillRect(0,0,3000,2000);
  for(let i=0;i<4000;i++){
    c.fillStyle = 'rgba('+(i*7%255)+','+(i*13%255)+','+(i*29%255)+',.6)';
    c.fillRect((i*97)%3000,(i*61)%2000,9,9);
  }
  const blob = await new Promise(r=>src.toBlob(r,'image/jpeg',0.92));
  log.push('source: 3000x2000 jpeg, '+Math.round(blob.size/1024)+' KB');

  const probe = document.createElement('canvas');
  probe.width = probe.height = 1;
  log.push('canvas WebP encoding supported here: '+
    (probe.toDataURL('image/webp').indexOf('data:image/webp')===0));

  async function drop(id){
    const el = document.getElementById(id);
    const file = new File([blob], 'photo.jpg', {type:'image/jpeg'});
    const dt = new DataTransfer(); dt.items.add(file);
    el.dispatchEvent(new DragEvent('drop',{dataTransfer:dt,bubbles:true,cancelable:true}));
    for(let i=0;i<120;i++){
      await new Promise(r=>setTimeout(r,100));
      const im = el.shadowRoot && el.shadowRoot.querySelector('img');
      if(im && im.src && im.src.indexOf('data:image/svg')!==0 && im.src.indexOf('data:')===0){
        await im.decode().catch(()=>{});
        const mime = (im.src.match(/^data:([^;,]+)/)||[])[1];
        const bytes = Math.round(im.src.length*3/4/1024);
        return id+': rendered width '+el.clientWidth+'px → stored '+
          im.naturalWidth+'x'+im.naturalHeight+', '+mime+', ~'+bytes+' KB';
      }
    }
    return id+': TIMED OUT';
  }

  log.push(await drop('plain'));
  log.push(await drop('pinned'));
  out.textContent = log.join('\n');
})();
</script>
