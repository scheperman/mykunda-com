<style>
body { background: var(--paper-2); }

/* ---- Layout ---- */
.tv-wrap { max-width: 1180px; margin: 0 auto; padding: 34px 28px 90px; }
.tv-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
.tv-head .hi { display: none; }
.tv-head h1 { font-size: 32px; line-height: 1.1; }
.tv-head p { color: var(--muted); font-size: 15px; margin-top: 5px; }

/* ---- View switcher (same vocabulary as .vswitch in admin-nav.js) ---- */
.view-switch { display: inline-flex; gap: 3px; margin-bottom: 22px; background: var(--white); border-radius: var(--r-pill); padding: 4px; box-shadow: inset 0 0 0 1.5px var(--line); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.view-switch::-webkit-scrollbar { display: none; }
.vs-btn {
  height: 38px; padding: 0 18px; border-radius: var(--r-pill); font-weight: 700; font-size: 14px;
  color: var(--ink-2); background: none; border: none; cursor: pointer; white-space: nowrap;
  box-shadow: none; transition: .15s; font-family: var(--sans);
  display: inline-flex; align-items: center; gap: 8px;
}
.vs-btn:hover { box-shadow: none; color: var(--green-700); }
.vs-btn.on { background: var(--green-700); color: #fff; box-shadow: none; }
.vs-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px;
  background: var(--paper-2); color: var(--ink-2); font-size: 11.5px; font-weight: 800;
}
.vs-btn.on .vs-badge { background: rgba(255,255,255,.22); color: #fff; }

/* ---- Stats ---- */
.tv-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.tv-stat {
  background: var(--white); border-radius: var(--r-lg); box-shadow: var(--sh-sm); padding: 20px 22px;
}
.tv-stat .num { font-family: var(--serif); font-size: 30px; font-weight: 800; color: var(--ink); line-height: 1; }
.tv-stat .lab { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 6px; }

/* ---- Panel ---- */
.tv-panel {
  background: var(--white); border-radius: var(--r-lg); box-shadow: var(--sh-sm); overflow: hidden;
}
.tv-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; border-bottom: 1px solid var(--line-2);
}
.tv-panel-head h2 { font-size: 20px; }

/* ---- Detail view ---- */
.tv-detail { display: grid; grid-template-columns: 1fr 380px; gap: 28px; align-items: start; }
.tv-back {
  display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px;
  color: var(--green-700); margin-bottom: 16px; cursor: pointer; border: none; background: none;
  font-family: var(--sans); padding: 0;
}
.tv-back:hover { text-decoration: underline; }

/* ---- Sidebar card ---- */
.tv-sidebar-card {
  background: var(--white); border-radius: var(--r-lg); box-shadow: var(--sh-sm);
  padding: 24px; border: 1px solid var(--line);
}

/* ---- Form ---- */
.tv-field { margin-bottom: 16px; }
.tv-field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
.tv-field textarea, .tv-field select {
  width: 100%; border: 1.5px solid var(--line); border-radius: var(--r-sm);
  padding: 11px 13px; font-size: 14.5px; outline: none; transition: .15s;
  font-family: var(--sans); resize: vertical; background: var(--white); color: var(--ink);
}
.tv-field textarea:focus, .tv-field select:focus { border-color: var(--green-500); }

/* ---- Info banner ---- */
.tv-info {
  border-left: 4px solid var(--amber-500); background: var(--amber-50);
  padding: 14px 18px; border-radius: 0 var(--r-md) var(--r-md) 0;
  font-size: 13.5px; color: var(--amber-600); line-height: 1.5; margin-bottom: 22px;
}
.tv-info b { color: var(--amber-600); }

.tv-success {
  border-left: 4px solid var(--green-500); background: var(--green-50);
  padding: 14px 18px; border-radius: 0 var(--r-md) var(--r-md) 0;
  font-size: 13.5px; color: var(--green-700); line-height: 1.5; margin-bottom: 22px;
}
.tv-success b { color: var(--green-700); }

/* ---- Empty ---- */
.tv-empty { padding: 54px 24px; text-align: center; color: var(--muted); }
.tv-empty h3 { font-size: 18px; color: var(--ink-2); margin-bottom: 6px; }

/* ---- Upload grid ---- */
.upload-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 16px 0; }

/* ---- Verified badge (large) ---- */
.verified-lg {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px 6px 10px;
  border-radius: var(--r-pill); background: var(--green-100); color: var(--green-700);
  font-weight: 700; font-size: 14px;
}
.verified-lg svg { flex-shrink: 0; }

/* ---- Doc viewer modal ---- */
.doc-modal-overlay {
  position: fixed; inset: 0; z-index: 500; background: rgba(10,20,16,.7);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); animation: tvFadeIn .15s;
}
.doc-modal {
  background: var(--paper); border-radius: var(--r-lg); box-shadow: var(--sh-lg);
  width: min(92vw, 680px); max-height: 90vh; overflow-y: auto; padding: 28px;
  animation: tvSlideUp .2s ease;
}
.doc-page {
  background: #fff; border: 1px solid #e0e0e0; border-radius: 4px;
  padding: 48px 40px; margin-bottom: 16px; min-height: 420px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
  font-family: 'Times New Roman', Georgia, serif;
  position: relative;
}
.doc-page-header {
  text-align: center; border-bottom: 2px solid #1a3a2a; padding-bottom: 16px; margin-bottom: 20px;
}
.doc-page-header h4 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 2.5px; color: #1a3a2a;
  margin: 0 0 4px; font-family: var(--sans);
}
.doc-page-header h3 {
  font-size: 18px; color: #1a3a2a; margin: 0; font-weight: 700;
}
.doc-page-seal {
  width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 50%;
  background: linear-gradient(135deg, #1a3a2a, #2d6a4f); display: flex;
  align-items: center; justify-content: center; color: #c9a84c; font-size: 24px; font-weight: 700;
  font-family: serif; border: 2px solid #c9a84c;
}
.doc-redacted {
  background: #f0f0f0; border-radius: 3px; height: 12px; margin: 6px 0;
}
.doc-redacted.w70 { width: 70%; }
.doc-redacted.w50 { width: 50%; }
.doc-redacted.w85 { width: 85%; }
.doc-redacted.w60 { width: 60%; }
.doc-redacted.w40 { width: 40%; }
.doc-redacted.w90 { width: 90%; }
.doc-field-row {
  display: grid; grid-template-columns: 140px 1fr; gap: 8px; margin-bottom: 10px;
  font-size: 13px; line-height: 1.5;
}
.doc-field-label { color: #666; font-family: var(--sans); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.doc-field-val { color: #222; }
.doc-stamp {
  position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px;
  border: 3px solid rgba(200, 50, 50, .25); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: rgba(200, 50, 50, .3); font-size: 10px; font-weight: 700;
  text-transform: uppercase; transform: rotate(-15deg); font-family: var(--sans);
  letter-spacing: 1px; text-align: center; line-height: 1.2;
}
.doc-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--paper-2); border-radius: var(--r-md);
  margin-bottom: 16px; font-size: 13px; color: var(--muted);
}
.doc-toolbar .doc-name { font-weight: 700; color: var(--ink); }
@keyframes tvFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes tvSlideUp { from { transform: translateY(12px); } to { transform: none; } }

/* ---- Toast ---- */
.tv-toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--green-900); color: #fff; padding: 14px 24px;
  border-radius: var(--r-pill); font-weight: 700; font-size: 14.5px;
  box-shadow: var(--sh-lg); z-index: 600; display: flex; align-items: center; gap: 10px;
  animation: tvSlideUp .25s ease;
}

/* ---- Responsive ---- */
@media (max-width: 960px) {
  .tv-detail { grid-template-columns: 1fr; }
  .tv-stats { grid-template-columns: 1fr 1fr; }
  .upload-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
  .tv-wrap { padding: 20px 16px 70px; }
  .tv-stats { grid-template-columns: 1fr 1fr; }
  .upload-grid { grid-template-columns: 1fr; }
  .view-switch { flex-wrap: wrap; }
}
</style>
